<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flowers For You Madam!</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="accept.css" />
</head>
<body>

  <div class="bg-canvas" id="bgCanvas"></div>

  <!-- =============================================
       LEFT SIDE STICKER
       Replace with your actual left sticker image.
       Example: src="images/accept_left.png"
       (yung excited guy sa kaliwa)
  ================================================ -->
  <img class="accept-sticker accept-left" src="images/happy-removebg-preview.png" alt="left sticker" />

  <!-- =============================================
       RIGHT SIDE STICKER
       Replace with your actual right sticker image.
       Example: src="images/accept_right.png"
       (yung screaming kid sa kanan)
  ================================================ -->
  <img class="accept-sticker accept-right" src="images/happ2-removebg-preview.png" alt="right sticker" />

  <div class="main-card" id="mainCard">

    <!-- =============================================
         MAIN CENTER IMAGE (Shrek with flowers)
         Replace with your actual image filename.
         Example: src="images/accept.png"
    ================================================ -->
    <div class="cat-wrapper">
      <img class="accept-main-img" src="images/shrek.jpg" alt="flowers for you madam" />
    </div>

    <div class="question">Flowers For You Madam!</div>

  </div>

  <script src="script.js"></script>
</body>
</html>
