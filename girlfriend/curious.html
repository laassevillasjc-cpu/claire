<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>are you curious? nyehehe</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="curious.css" />
</head>
<body>

  <div class="bg-canvas" id="bgCanvas"></div>

  <div class="main-card" id="mainCard">

    <div class="curious-stack">

      <!-- =============================================
           ENVELOPE IMAGE — stays behind, peeking
           Replace with your actual envelope image.
           Example: src="images/open.png"
      ================================================ -->
      <img
        class="envelope-img"
        src="images/open.png"
        alt="envelope"
      />

      <!-- =============================================
           MEME STICKER — sits on top of the envelope
           Replace with your actual meme sticker image.
           Example: src="images/curious.png"
      ================================================ -->
      <img
        class="meme-img"
        src="images/joker.jpg"
        alt="curious meme"
      />

    </div>

    <div class="question">are you curious? nyehehe</div>
    <div class="subtitle">click the button below 👇</div>

    <!-- =============================================
         CLICK BUTTON (image as button)
         Replace 'images/YOUR_CLICK_BTN_IMAGE.png'
         with your bow/seal image.
         Replace 'next_frame.html' with your next page!
    ================================================ -->
    <div class="click-btn-wrapper">
      <span class="click-label">click this!</span>
      <img
        class="click-btn-img"
        src="images/ribbotton.png"
        alt="click this"
        onclick="goTo('loveletter.html')"
      />
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
